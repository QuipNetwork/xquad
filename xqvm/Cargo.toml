[package]
name                 = "xqvm"
description          = "X-Quadratic Virtual Machine -- bytecode interpreter for the XQuad Toolchain"
version              = "0.5.0-dev"
license.workspace    = true
repository.workspace = true
edition              = "2024"
build                = "build.rs"
readme               = "README.md"
# Targets that need `xqasm`, a path-only dev-dependency the published
# tarball drops (see [dev-dependencies]). Leaving them in would make
# `cargo test` against the packaged crate fail to compile; cargo drops the
# matching target from the packaged manifest. The vector data itself ships.
exclude = [ "examples/tsp", "tests/vector_suite" ]

[lints]
workspace = true

[features]
default = [ "std" ]
std = [
    "miette",
    "thiserror/std",
]

[dependencies]
crc32fast = { version = "1.5", default-features = false }
# hashbrown provides no_std-compatible HashMap/HashSet used by the dataflow/
# verifier modules. Declared explicitly because Rust does not allow using
# transitive dependencies directly.
hashbrown           = { version = "0.15", default-features = false, features = [ "default-hasher" ] }
pastey.workspace    = true
thiserror.workspace = true

# std-only optional dependencies
miette = { workspace = true, optional = true }

# Path-only dev-dep; overrides the version-carrying workspace alias
# because cargo strips dev-dependencies from the published tarball
# and chasing an `xqasm` version on crates.io during xqvm's dry-run
# fails (xqvm gets published before xqasm).
[dev-dependencies]
xqasm            = { path = "../xqasm" }
miette.workspace = true
# The vector suite: one named test per vector without a build script, and
# the vector file format.
libtest-mimic        = "0.8"
serde                = { version = "1", features = [ "derive" ] }
serde_json.workspace = true

[[test]]
name    = "vectors"
path    = "tests/vector_suite/main.rs"
harness = false

[build-dependencies]
serde         = { version = "1", features = [ "derive" ] }
serde_yaml_ng = "0.10"

include = [
    "**/*.toml",
]

exclude = [
    ".cargo/**",
    ".git/**",
    "target/**",
    "**/Cargo.lock",
    # Developer-local / gitignored artifacts (mirrors .gitignore). These are
    # never committed, so taplo must not lint stray TOML inside them. In git
    # worktrees these may be symlinks back to the primary checkout; taplo uses
    # globset (not gitignore syntax), so a root-anchored `dir/**` pattern still
    # matches files reached through the symlink.
    ".venv/**",
    ".claude/**",
    "scratch/**",
    "graphify-out/**",
    # `.orca` must be excluded at the root. In a worktree it symlinks to the
    # primary checkout, which contains the worktree, so following it recurses:
    # .orca/worktrees/<wt>/.orca/worktrees/<wt>/... Root-anchored patterns like
    # `.cargo/**` do not match the nested copies reached that way, so without
    # this entry `taplo fmt --check` never terminates cleanly in any worktree.
    ".orca/**",
]

[formatting]

# Indentation
indent_string = "    "

# Arrays formatting
array_auto_expand   = true
array_auto_collapse = false
compact_arrays      = false

# Inline tables
compact_inline_tables = false

# Alignment
align_entries  = true
align_comments = true

# Layout
allowed_blank_lines = 1
column_width        = 100

# File ending
trailing_newline = true

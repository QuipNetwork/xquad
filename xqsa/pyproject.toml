[build-system]
requires      = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "xqsa"
description = "Solver adapters for XQMX models (dwave-samplers; pluggable solver interface)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
version = "0.2.0"
dependencies = [
    "xqvm_py",
    "dwave-samplers>=1.0",
]

[project.optional-dependencies]
dwave = ["dwave-system>=1.0"]

[tool.uv.sources]
xqvm_py.workspace = true

[tool.hatch.build.targets.wheel]
packages = [ "." ]
exclude = [
    "tests/**",
    "pyproject.toml",
]

[tool.hatch.metadata]
# Flat layout: the package directory IS the project root.
allow-direct-references = true

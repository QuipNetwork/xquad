[build-system]
requires      = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "xqsa"
description = "Solver adapters for XQMX models (dwave-samplers; pluggable solver interface)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
version = "0.3.2"
dependencies = [
    # Pinned exact. The five published distributions share one workspace
    # version and are uploaded as a set, so a mixed-version install is never
    # a supported combination; see RELEASING.md for the bump touchpoints.
    "xqvm_py==0.3.2",
    "dwave-samplers>=1.0",
]

[project.optional-dependencies]
cuda  = [ "cupy-cuda12x>=13.0", "nvidia-cuda-nvrtc-cu12", "nvidia-cuda-runtime-cu12" ]
dwave = [ "dwave-system>=1.0" ]
metal = [ "pyobjc-framework-Metal>=11.0; sys_platform == 'darwin'" ]
# `quip-signer` is the hybrid sr25519 + ML-DSA-44 signing extension. Linux
# installs resolve a manylinux wheel; macOS and Windows build it from the sdist
# with a local Rust toolchain (the same policy as xquad's own native packages).
# SolverQuip lazy-imports it, so `import xqsa` and every other solver stay
# healthy without this extra. Pin `>=0.2.2`: 0.2.1 shipped a broken wheel.
quip = [ "substrate-interface>=1.7.4,<2", "quip-signer>=0.2.2" ]

[tool.uv.sources]
xqvm_py.workspace = true

[tool.hatch.build.targets.wheel]
only-include = [ "." ]
sources = { "." = "xqsa" }
dev-mode-dirs = [ ".." ]
exclude = [
    "tests/**",
    "pyproject.toml",
    "README.md",
    "PKG-INFO",
    ".gitignore",
    # Agent instructions, never package content. CLAUDE.md is gitignored today
    # so it cannot reach the wheel, but the exclude survives a .gitignore edit.
    "AGENTS.md",
    "CLAUDE.md",
]

[tool.hatch.metadata]
# The package directory is the project root. `sources` rewrites the wheel
# prefix to the package name; `dev-mode-dirs` puts the repo root on
# sys.path for editable installs.
allow-direct-references = true

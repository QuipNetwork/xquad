# Release pipeline -- publishes the xquad toolchain to crates.io and
# PyPI on every tag of the form `v<digit>...`.
#
# Five jobs, chained by `needs:`:
#
#   release:validate  runs on every pipeline (no `rules:` at all), and
#                      validates crate packaging plus the five Python
#                      distributions before anything is published.
#   release:crates     tag only -- publishes xqvm, xqasm, xqcli to
#                      crates.io in dependency order.
#   release:pypi       tag only -- publishes the five PyPI
#                      distributions, umbrella package last.
#   release:notes      NON-RC tag only -- renders git-cliff notes and
#                      creates the GitLab Release page. The one job in
#                      this chain that does not run on an rc tag: rc
#                      crates and wheels still publish, only the Release
#                      page is skipped (QUI-1096 -- see the job's own
#                      `rules:` comment, and RELEASING.md's "Release
#                      candidates").
#   release:auto-tag   push to main -- tags `vX.Y.Z` when a
#                      `release/vX.Y.Z` MR merges.
#
# Chain: release:validate -> release:crates -> release:pypi ->
# release:notes (the last link only on a non-rc tag).
# release:auto-tag is standalone -- `needs: []`, so it
# starts at t=0 and waits on nothing, including release:validate in its
# own stage. It fires on the push that merges a release MR, and the tag
# it pushes is what triggers the other four jobs on a fresh, tag
# pipeline, where release:validate gates the publishing. See that job's
# `needs: []` comment for why the tag is deliberately not gated on the
# merge-commit pipeline.
#
# Required protected CI variables (set once in project settings ->
# CI/CD -> Variables; masked + protected):
#
#   CARGO_REGISTRY_TOKEN  crates.io API token for ops@postquant.xyz
#                         scoped to xqvm + xqasm + xqcli (publish-new
#                         + publish-update).
#
# PyPI publishing uses Trusted Publishing (OIDC) -- no long-lived
# token in CI. Each of the 5 PyPI projects (xqffi, xqvm_py, xqcp,
# xqsa, xquad) must have a GitLab Trusted Publisher configured at
# pypi.org/manage/project/<name>/settings/publishing/ pointing at:
#
#   namespace = quip.network
#   project   = xquad
#   pipeline  = .gitlab-ci.yml
#   env       = release
#
# The matching `release` environment must exist in
# Settings -> CI/CD -> Environments, restricted to protected tags `v*`.
# Only release:pypi carries `environment: release` below -- it is the
# only job this environment (and its five id_tokens) applies to;
# release:validate runs on every ref and must not acquire it.
#
# Release MR flow (QUI-580):
#
#   1. Open a branch named `release/vX.Y.Z` with the version bump.
#   2. Create an MR using the "release" template; both @kleczkowski
#      and @meganathanmanish must approve (2 approvals required).
#   3. Merge -> `release:auto-tag` fires on main, looks up the merged
#      MR via the GitLab API, and pushes tag `vX.Y.Z` via glab.
#   4. The tag push triggers the rest of this pipeline as normal.
#      release:validate runs again on the tag, then release:crates,
#      then release:pypi, then -- on a non-rc tag only -- release:notes
#      creates the GitLab Release page with git-cliff notes once
#      artefacts are live. An rc tag stops after release:pypi.
#
#   Prerequisite: GITLAB_API_TOKEN (project access token, api scope)
#   must be set in Settings -> CI/CD -> Variables (masked).
#   Protected tag pattern `v*` must exist in
#   Settings -> Repository -> Protected tags.
#
# See RELEASING.md for the full tag-cut checklist.

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------

# A top-level `variables:` block in a file brought in via `include:` is
# merged into the pipeline-global config by GitLab, not scoped to this
# file -- so RELEASE_CLI_URL below is visible to every job in the
# pipeline, not just release:validate and release:notes. That is
# exactly what QUI-1092 wants (both jobs read it with no job-level
# `variables:` of their own), but it means a later reader must not
# assume this block is file-private.
variables:
    # Pinned to v0.24.0 (verified reachable unauthenticated on
    # 2026-08-18, HTTP 200, and the latest published release at that
    # time) rather than `latest`, so the release path does not float.
    # See release:notes below for where this is fetched, and
    # release:validate for where the fetch itself is probed ahead of a
    # tag.
    RELEASE_CLI_URL: "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/v0.24.0/release-cli-linux-amd64"

# ---------------------------------------------------------------------------
# Shared rules
# ---------------------------------------------------------------------------

# Run only on pushed tags like v0.1.0, v0.0.1-rc1, v1.2.3, ...
#
# Kept local to this file rather than promoted to setup.yml: it has
# exactly one consuming file (this one), and YAML anchors work within a
# single document, so there is no cross-file reason to move it. Not an
# oversight.
.on-release-tag: &on-release-tag
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d/

# ---------------------------------------------------------------------------
# Release jobs (tag-triggered chain)
# ---------------------------------------------------------------------------

# Validate-then-publish gate (QUI-473). No `rules:` at all -- unlike
# every other job in this file, this one runs on every pipeline the
# root `workflow:` admits, including MR, branch, and tag pipelines.
# That is the structural change QUI-1002 exists to make: the same
# setup and the same validation the publish jobs depend on is now
# continuously exercised instead of only at release time, so a broken
# release setup fails on a merge request instead of mid-release.
#
# Catches packaging regressions -- missing license file, broken
# maturin config, metadata drift, pyproject manifest issues -- without
# leaving half-published artefacts behind on a partial failure. See
# RELEASING.md: "If release:validate fails, no registry has been
# touched."
#
# `needs:` takes the same verify+test+hardware gate as docs:* (see
# setup.yml's "Dependency gating" section). verify:policy sits inside
# that gate, and render-changelog is a lint-policy prerequisite
# (Makefile), so cliff.toml is proven to render before anything
# publishes without duplicating that render inside this job. The cost:
# on a tag, this job -- and the whole publish chain hanging off it --
# waits on hardware:cuda/qpu/metal and on test:substrate's cold path.
# Taken deliberately, matching the docs:* precedent: we would rather
# stall a release than publish artefacts built from a tree the
# hardware suite just proved broken.
release:validate:
    stage: release
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    # dependencies: [] on every job in this file whose `needs:` names
    # other jobs; release:auto-tag is the one exception, since its
    # `needs: []` already downloads nothing. Without it, GitLab
    # downloads every prior stage's artifacts by default; this job's
    # predecessor, the old tag-only release:validate, was seen
    # downloading docs/book/build/ from docs:build before running a
    # packaging check -- verified on the v0.3.1 tag pipeline -- which is
    # pure waste. No job in this file consumes another job's artifacts;
    # every ordering relationship between them is expressed through
    # `needs:` alone.
    dependencies: []
    # `policy: pull` on both root default cache entries. A job-level
    # `cache:` REPLACES the default rather than merging with it
    # (.gitlab-ci.yml's `default: cache:` comment), so both entries are
    # restated here in full -- key and paths, not just the policy --
    # or this job would silently stop caching at all.
    #
    # Pull-only because this job has nothing worth uploading. Its other
    # leg, check-python-dists (Makefile), drives scripts/python-dists.sh,
    # which builds the five wheels through maturin straight into the
    # shared target/ -- throwaway output, rebuilt from scratch every run
    # regardless of what is cached. And nothing downstream ever consumes
    # what this job produces: `dependencies: []` two lines up already
    # says so, and no job in this file `needs:` release:validate for
    # artefacts. Pushing here would upload a fresh Cargo.lock-keyed cache
    # entry that no later job pulls, only for the next run's push to
    # overwrite it unread -- the same wasted-write shape check-crate-
    # publish's own scratch-tree fix (Makefile) exists to avoid on the
    # other leg. Left at pull so this job still benefits from the warm
    # cache verify:rust and test:rust push, without adding a third writer
    # that helps no one.
    cache:
        - key:
              files:
                  - Cargo.lock
          paths:
              - .cargo/registry/
              - .cargo/git/
              - target/
          policy: pull
        - key:
              files:
                  - scripts/cargo-tools.lock
          paths:
              - .cargo/bin/
          policy: pull
    # 75m: the two dry-run jobs this merges each carried 20m, each sized
    # as cold-cache room for exactly ONE of the two legs (crate publish
    # dry-run, Python dist build). This job runs both legs serially, and
    # the crate leg grew from a single-crate `cargo publish --dry-run -p
    # xqvm` to `--workspace` (three crates, all at full verify strength,
    # in target/package/, sharing no compilation with the maturin build
    # in the same job). 20m + 20m of pre-existing per-leg cold-cache
    # budget does not cover a tripled crate leg, and this runner fleet
    # has no shared cache server, so cold is a normal outcome. Per
    # setup.yml's "Job timeouts" section, a timeout exists to kill a job
    # that will never finish, not to police one that is merely slow, so
    # a generous limit here costs nothing when things are healthy.
    timeout: 75m
    before_script:
        - !reference [.fragments, python-publish]
    script:
        - make -k check-release
        # QUI-1092: release:notes fetches release-cli from gitlab.com's
        # generic package registry in its before_script, but it is the
        # LAST job on a tag pipeline -- a 404 there is discovered only
        # after crates.io and PyPI publishing has already run and is
        # irreversible. release:validate runs on every pipeline, so
        # probing the same URL here exercises the fetch continuously,
        # well ahead of a tag.
        #
        # A one-byte range GET, not a HEAD: the probe has to take the
        # same path as the fetch it stands in for, which is `-fsSL` (GET,
        # follows redirects) further down this file. GitLab serves this
        # URL directly today, but a generic-package download is normally
        # redirected to object storage when `proxy_download` is off, and
        # under that mode a `-f` HEAD with no `-L` fails on the redirect
        # while release:notes' own `-L` fetch still succeeds -- turning
        # every merge request red for a URL that is in fact fine
        # (release:validate has no `rules:`, and the root `retry:` block
        # deliberately excludes script_failure).
        #
        # `-fsSIL` would follow the redirect but is still the wrong
        # method: an object-storage redirect lands on a SigV4 presigned
        # URL whose signature covers the HTTP verb, so a HEAD against a
        # presigned GET is a 403 in exactly the scenario this is meant to
        # survive. `-r 0-0` keeps the verb correct and the transfer at
        # one byte; a server that ignores Range answers 200 with the full
        # body, which `-o /dev/null` discards.
        - curl -fsSL --retry 3 --retry-all-errors -r 0-0 -o /dev/null "${RELEASE_CLI_URL}"

# Publish the three Rust crates to crates.io in topological dependency
# order: xqvm (no deps) -> xqasm (depends on xqvm) -> xqcli (depends on
# both). The `xqffi` crate keeps `publish = false` -- it's a pyo3
# cdylib consumed via the PyPI wheel, not a crates.io dependency.
#
# Three sequential `cargo publish -p` calls, not one `cargo publish
# --workspace`: cargo hard-fails on an already-published version and
# has no `--skip-existing`, so a merged job publishing all three crates
# and then dying during the wheel upload could not be safely re-run --
# the retry would fail at the first `cargo publish` and never reach the
# wheels. Keeping release:crates and release:pypi as separate jobs is
# what gives retries per-registry granularity: twine has
# `--skip-existing`, cargo does not, and that asymmetry is the whole
# argument for the split.
release:crates:
    stage: release
    needs:
        - release:validate
    <<: *on-release-tag
    dependencies: []
    timeout: 30m
    script:
        - cargo --version
        - cargo publish --locked -p xqvm --token "${CARGO_REGISTRY_TOKEN}"
        - cargo publish --locked -p xqasm --token "${CARGO_REGISTRY_TOKEN}"
        - cargo publish --locked -p xqcli --token "${CARGO_REGISTRY_TOKEN}"

# Publish the Python distributions to PyPI. Order matters: xquad is
# the umbrella meta-package and depends on the peers, so it must land
# *after* them or `pip install xquad` cannot resolve its deps.
#
#   1. xqffi            (pyo3 cdylib -- maturin builds:
#                         - abi3 wheel for linux-x86_64 (native)
#                         - abi3 wheel for linux-aarch64 (cargo-zigbuild)
#                         - sdist (universal source fallback))
#   2. xqvm_py          (pure-Python reference VM)
#   3. xqcp             (DSL)
#   4. xqsa             (solver adapters)
#   5. xquad            (umbrella -- depends on 1-4)
#
# macOS and Windows wheels are out of scope; those platforms fall back
# to building from the sdist with a local Rust toolchain.
release:pypi:
    stage: release
    needs:
        - release:validate
        - release:crates
    <<: *on-release-tag
    # `environment: release` matches the env name registered on each
    # PyPI Trusted Publisher; PyPI rejects the OIDC exchange if the
    # job's environment doesn't match what's configured project-side.
    # Restricted to protected tags `v*` (this file's header). This is
    # the only job in the chain that carries it -- release:validate
    # runs on every ref and must not.
    environment: release
    # GitLab mints one short-lived JWT per id_tokens entry; PyPI's
    # `/_/oidc/mint-token` endpoint is single-use per JWT (anti-replay
    # on the `jti` claim), so a monorepo publishing N packages in one
    # job needs N distinct JWTs. We mint one per PyPI project; the
    # script in `scripts/python-dists.sh` exchanges each for that
    # project's API token at upload time.
    #
    # twine >=6.1's auto-detection (`id.detect_credential("pypi")`)
    # only handles a single ambient JWT, which is why upload uses
    # explicit TWINE_USERNAME/TWINE_PASSWORD per package rather than
    # relying on auto-detect.
    #
    # Audience MUST be the literal `pypi` (not `pypi.org`).
    id_tokens:
        PYPI_ID_TOKEN_XQFFI:
            aud: pypi
        PYPI_ID_TOKEN_XQVM_PY:
            aud: pypi
        PYPI_ID_TOKEN_XQCP:
            aud: pypi
        PYPI_ID_TOKEN_XQSA:
            aud: pypi
        PYPI_ID_TOKEN_XQUAD:
            aud: pypi
    dependencies: []
    timeout: 45m
    before_script:
        - !reference [.fragments, python-publish]
    script:
        # See scripts/python-packages.sh for the package list and
        # scripts/python-dists.sh for the build/upload sequence.
        - bash scripts/python-dists.sh publish

# Generate GitLab Release notes from the conventional-commit history
# via git-cliff (cliff.toml) and create the GitLab Release page --
# release:changelog and release:notes merged into one job.
#
# The two used to be split only by an image constraint: the
# declarative `release:` keyword below needs the release-cli image,
# while git-cliff lives elsewhere, so the two jobs existed only to hand
# release-notes.md between them as an artifact. This job stays on
# rust:latest (the workspace default) instead, which keeps git-cliff
# pinned via scripts/cargo-tools.lock rather than floating on whatever
# Alpine edge ships; release-cli is installed directly instead of
# switching images.
#
# release-cli is fetched from gitlab.com's generic package registry, at
# the pinned URL in the top-level RELEASE_CLI_URL variable (see this
# file's "Variables" section for why it does not float). That fetch is
# no longer unexercised before a tag: release:validate -- which runs on
# every pipeline -- probes the same URL as the last line of its
# `script:`, so a 404 or an unreachable registry surfaces on a merge
# request instead of here, last in the tag-only publish chain.
#
# `STRIP=all` drops the cliff.toml header/footer so the published
# notes contain only the tag's own section -- the GitLab release page
# already supplies its own framing (tag name, date, etc.).
#
# CHANGELOG.md is gitignored; the in-tree source of truth for release
# notes is `cliff.toml` plus the conventional-commit log.
#
# `GIT_DEPTH: 0` overrides GitLab's default shallow clone -- git-cliff
# walks the full commit history back through tag boundaries to render
# release sections, so a shallow clone produces silently truncated
# notes. The same override is set on `verify:policy`.
#
# Uses the declarative `release:` keyword so CI_JOB_TOKEN is sufficient
# -- no extra PAT needed, and the job is idempotent (re-running does
# not error if the release already exists).
release:notes:
    stage: release
    # Runs after release:pypi so the GitLab Release page goes up only
    # once artefacts are live on crates.io and PyPI (QUI-496).
    needs:
        - release:pypi
    # Deliberately its own `rules:`, not `<<: *on-release-tag`. That
    # anchor is shared with release:crates and release:pypi (this
    # file's "Shared rules" section), which must keep publishing rc
    # artefacts -- only the GitLab Release page is skipped for an rc
    # tag. QUI-1096: cliff.toml's tag_pattern no longer recognises `-rc`
    # tags as releases at all, so an rc tag's commits are folded into the
    # following non-rc release's section instead of getting a page of
    # their own; running this job on the rc tag itself would
    # either publish an empty page (no commits since the last non-rc
    # release yet) or a duplicate once the real release ships. Narrow
    # the job, not the anchor.
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d/ && $CI_COMMIT_TAG !~ /-rc/
    variables:
        GIT_DEPTH: 0
    dependencies: []
    # Narrowed to `.cargo/bin/` at `policy: pull`, mirroring
    # `.rust-tools` in setup.yml. This job installs a SUBSET of
    # scripts/cargo-tools.lock (`--only git-cliff` below) while the
    # root default cache would have it push the `.cargo/bin/` entry
    # under that lock file's key -- which is exactly the case
    # `.rust-tools`'s `policy: pull` note exists to prevent. It matters
    # more here than anywhere else: this is the LAST job on a tag
    # pipeline, so on a cold `.cargo/bin/` restore it would publish a
    # git-cliff-only archive and win the race against verify:rust's
    # full-set push. It cannot extend `.rust-tools` directly -- that
    # template's before_script installs from a CARGO_TOOLS variable and
    # this job needs its own release-cli fetch appended -- so the cache
    # block is repeated rather than inherited.
    #
    # Pre-existing rather than a regression from merging
    # release:changelog and release:notes: release:changelog carried no
    # `cache:` key either and inherited the same root default. (The
    # `cache: []` in the old pair sat on release:notes, which ran the
    # release-cli image and did nothing but create the release page.)
    # Fixed here because merging the two is the moment the job acquired
    # both halves -- the subset install and the tail position.
    #
    # `policy: pull` rather than `cache: []`: install-cargo-tools.sh
    # short-circuits on `command -v`, so a warm pull skips the git-cliff
    # install outright, while `cache: []` would pay for it every run.
    cache:
        - key:
              files:
                  - scripts/cargo-tools.lock
          paths:
              - .cargo/bin/
          policy: pull
    timeout: 15m
    before_script:
        - !reference [.fragments, cargo-path]
        # Install only git-cliff (version pinned in
        # scripts/cargo-tools.lock); the rest of the cargo toolchain
        # isn't needed to render the changelog.
        - bash scripts/install-cargo-tools.sh --only git-cliff
        # release-cli isn't a cargo tool and isn't in cargo-tools.lock;
        # fetch the pinned binary directly instead of switching this
        # job to the release-cli image (see the job comment above).
        - curl -fsSL --retry 3 --retry-all-errors -o /usr/local/bin/release-cli "${RELEASE_CLI_URL}"
        - chmod +x /usr/local/bin/release-cli
    script:
        - make changelog-release VERSION="${CI_COMMIT_TAG}" STRIP=all OUTPUT=release-notes.md
        - cat release-notes.md
    release:
        tag_name: $CI_COMMIT_TAG
        name: "xquad ${CI_COMMIT_TAG}"
        description: ./release-notes.md

# ---------------------------------------------------------------------------
# Auto-tag job (main-push-triggered, release MR flow)
# ---------------------------------------------------------------------------

# Fires on every push to main. Queries the GitLab MR API for the
# merged MR whose merge_commit_sha or squash_commit_sha matches
# CI_COMMIT_SHA, then reads source_branch directly -- no commit message
# parsing. Both fields are checked because squash merges set
# merge_commit_sha to null and record the pushed SHA in
# squash_commit_sha instead. If the branch matches release/vX.Y.Z the
# version is extracted and only the git tag is pushed via glab api. The
# release page is created separately by release:notes once git-cliff
# notes are ready. Any other push exits cleanly. See
# scripts/auto-tag-release.sh for the implementation.
#
# Required CI variable (Settings -> CI/CD -> Variables, masked):
#   GITLAB_API_TOKEN  -- project access token with api scope (write_repository
#                       minimum). CI_JOB_TOKEN cannot query MR metadata.
release:auto-tag:
    stage: release
    image: registry.gitlab.com/gitlab-org/cli:latest
    cache: []
    # `needs: []` -- start at t=0, gated by `rules:` alone. This is the
    # only job in this file that does not wait on something, and the
    # two reasons are worth keeping straight because they pull in
    # opposite directions.
    #
    # It is what makes `interruptible: false` below mean anything.
    # GitLab's default auto-cancel policy
    # (`workflow:auto_cancel:on_new_commit: conservative`) spares a
    # pipeline only once a non-interruptible job has *started*; a
    # PENDING job is cancelled regardless of the flag. Without
    # `needs:`, the stage barrier held this job pending behind verify,
    # test, hardware and docs for the better part of an hour, so the
    # flag protected nothing and a second merge to main cancelled the
    # tag before it was ever pushed.
    #
    # It also means this job does NOT wait on release:validate, which
    # runs in this same stage. That is deliberate, not an oversight.
    # release:validate is the publish gate, and it is wired ahead of
    # release:crates -> release:pypi -> release:notes by `needs:` on
    # the TAG pipeline -- so nothing reaches crates.io or PyPI unless
    # it passes against the tagged commit itself. It has also already
    # run green on the release MR's own pipeline, which is what the two
    # required approvals approved. Gating the tag on a third run of the
    # same check against the merge commit buys almost nothing and costs
    # the guarantee above: the job would sit pending through the
    # hardware tier again, cancellable again, and would inherit
    # `on_success` from upstream, so one flaky hardware:qpu on the
    # merge commit would mean no tag and nothing red.
    #
    # The asymmetry is the whole argument. A tag pushed against a bad
    # tree is loud and reversible -- red tag pipeline, zero registry
    # writes, delete the tag and re-cut (RELEASING.md's pre-flight).
    # A tag silently never pushed is neither. The tag is a trigger,
    # not a commitment.
    #
    # `stage: release` is now cosmetic -- `needs:` overrides stage
    # ordering for start time, so this job runs alongside verify:* at
    # t=0 despite sitting in the last stage. Kept for readability: it
    # is a release-path job and belongs with its neighbours in this
    # file. Do not read the stage as an ordering claim.
    #
    # No `dependencies: []` here, unlike every other job in this file:
    # `needs:` governs artifact download once present, and `needs: []`
    # already means "download nothing".
    needs: []
    timeout: 10m
    # See the `needs: []` note above -- the two settings only work as a
    # pair. The root `default:` in .gitlab-ci.yml makes every job
    # interruptible, which is wrong here: this job fires on pushes to
    # main, so two merges to main in quick succession would cancel the
    # first job before it tags. The script also exits 0 when it finds
    # no release MR, so a cancelled run never goes red -- a release
    # would simply never happen, silently.
    interruptible: false
    before_script:
        # bash too: registry.gitlab.com/gitlab-org/cli:latest is
        # Alpine/busybox and ships no bash by default, while
        # scripts/auto-tag-release.sh carries a `#!/usr/bin/env bash`
        # shebang like every other script in scripts/ and is invoked
        # below as `bash scripts/auto-tag-release.sh`. Without this, the
        # job exits 127 (bash: not found) on every push to main and no
        # release tag is ever pushed.
        - apk add --no-cache jq bash
    rules:
        # Only on direct pushes to main -- not on tag pipelines or MR
        # pipelines (MR pipelines run before the merge; we want after).
        #
        # Deliberately the literal "main", not
        # $CI_COMMIT_REF_PROTECTED (the pattern test.yml's fixture jobs
        # use for their path-gating rules, QUI-1043): this job looks
        # the merged MR up against target_branch=main specifically, so
        # generalising the rule to any protected ref would also fire it
        # on a protected release/* branch, which is wrong.
        - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
          when: on_success
    variables:
        GITLAB_TOKEN: "${GITLAB_API_TOKEN}"
    script:
        - bash scripts/auto-tag-release.sh

# Release pipeline — publishes the xquad toolchain to crates.io and
# PyPI on every tag of the form `v<digit>...`.
#
# Required protected CI variables (set once in project settings →
# CI/CD → Variables; masked + protected):
#
#   CARGO_REGISTRY_TOKEN  crates.io API token for ops@postquant.xyz
#                         scoped to xqvm + xqasm + xqcli (publish-new
#                         + publish-update).
#
# PyPI publishing uses Trusted Publishing (OIDC) — no long-lived
# token in CI. Each of the 5 PyPI projects (xqffi, xqvm_py, xqcp,
# xqsa, xquad) must have a GitLab Trusted Publisher configured at
# pypi.org/manage/project/<name>/settings/publishing/ pointing at:
#
#   namespace = quip.network
#   project   = xquad
#   pipeline  = .gitlab-ci.yml
#   env       = release
#
# The matching `release` environment must exist in
# Settings → CI/CD → Environments, restricted to protected tags `v*`.
#
# Release MR flow (QUI-580):
#
#   1. Open a branch named `release/vX.Y.Z` with the version bump.
#   2. Create an MR using the "release" template; both @kleczkowski
#      and @meganathanmanish must approve (2 approvals required).
#   3. Merge → `release:auto-tag` fires on main, looks up the merged
#      MR via the GitLab API, and pushes tag `vX.Y.Z` via glab.
#   4. The tag push triggers the rest of this pipeline as normal.
#      `release:notes` creates the GitLab Release page with git-cliff
#      notes via glab once artefacts are published.
#
#   Prerequisite: GITLAB_API_TOKEN (project access token, api scope)
#   must be set in Settings → CI/CD → Variables (masked).
#   Protected tag pattern `v*` must exist in
#   Settings → Repository → Protected tags.
#
# See RELEASING.md for the full tag-cut checklist.

# ---------------------------------------------------------------------------
# Shared rules
# ---------------------------------------------------------------------------

# Run only on pushed tags like v0.1.0, v0.0.1-rc1, v1.2.3, …
.on-release-tag: &on-release-tag
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d/

# Same trigger as `.on-release-tag`, but the job sits as a manual
# "play" button until a maintainer clicks it (QUI-495). Used by the
# publish jobs so a tag push fires validate + GitLab Release notes
# automatically while the irreversible registry uploads (cargo
# publish, twine upload) wait for explicit confirmation. The tag is
# effectively a "draft release" until the click happens.
#
# `allow_failure: true` keeps the pipeline reported as green while
# the manual job sits unclicked -- otherwise an unclicked draft tag
# would show as a failed pipeline forever.
.on-release-tag-manual: &on-release-tag-manual
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d/
          when: manual
          allow_failure: true

# Run on every MR and push; never on the release tag (that's what the
# actual release jobs are for). These dry-runs prove the release path
# works without publishing.
.on-pr-or-push: &on-pr-or-push
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d/
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH
          when: on_success

# uv + maturin + twine for the Python publish jobs. We stay on
# rust:latest (the workspace default) so cargo is available for
# maturin's cdylib build; uv provides the wheel builder for the
# pure-Python peers.
.setup-python-publish: &setup-python-publish
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python3-venv curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="${HOME}/.local/bin:${PATH}"
    - uv --version
    - uv tool install maturin --with-requirements /dev/null
    # twine ≥6.1 added preliminary OIDC trusted-publishing support;
    # earlier versions fall back to interactive prompt when no token
    # env is present, which hangs the CI.
    - uv tool install 'twine>=6.1'
    - export PATH="${HOME}/.local/share/uv/tools/maturin/bin:${HOME}/.local/share/uv/tools/twine/bin:${PATH}"
    - maturin --version
    - twine --version

# ---------------------------------------------------------------------------
# Auto-tag job (main-push-triggered, release MR flow)
# ---------------------------------------------------------------------------

# Fires on every push to main. Queries the GitLab MR API for the
# merged MR whose merge_commit_sha or squash_commit_sha matches
# CI_COMMIT_SHA, then reads source_branch directly — no commit
# message parsing. Both fields are checked because squash merges set
# merge_commit_sha to null and record the pushed SHA in
# squash_commit_sha instead. If the branch matches release/vX.Y.Z
# the version is extracted and only the git tag is pushed via glab
# api. The release page is created separately by release:notes once
# git-cliff notes are ready. Any other push exits cleanly.
#
# Required CI variable (Settings → CI/CD → Variables, masked):
#   GITLAB_API_TOKEN  — project access token with api scope (write_repository
#                       minimum). CI_JOB_TOKEN cannot query MR metadata.
release:auto-tag:
    stage: release
    image: registry.gitlab.com/gitlab-org/cli:latest
    cache: []
    # No artifacts from previous stages needed; prevents GitLab from
    # downloading e.g. the docs build into this lightweight Alpine job.
    dependencies: []
    before_script:
        - apk add --no-cache jq
    rules:
        # Only on direct pushes to main — not on tag pipelines or MR
        # pipelines (MR pipelines run before the merge; we want after).
        - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
          when: on_success
    variables:
        GITLAB_TOKEN: "${GITLAB_API_TOKEN}"
    script:
        - |
            SOURCE_BRANCH=$(glab api \
              "projects/${CI_PROJECT_ID}/merge_requests?state=merged&target_branch=main&order_by=updated_at&sort=desc&per_page=100" \
              | jq -r ".[] | select(.merge_commit_sha == \"${CI_COMMIT_SHA}\" or .squash_commit_sha == \"${CI_COMMIT_SHA}\") | .source_branch")

            if [ -z "$SOURCE_BRANCH" ]; then
              echo "No merged MR found for this commit — nothing to tag."
              exit 0
            fi

            echo "Merged from branch: ${SOURCE_BRANCH}"

            VERSION=$(printf '%s' "$SOURCE_BRANCH" | sed -n 's|^release/v||p')

            if [ -z "$VERSION" ]; then
              echo "Source branch is not a release branch — nothing to tag."
              exit 0
            fi

            echo "Detected release merge: v${VERSION}"
            if ! TAG_OUT=$(glab api "projects/${CI_PROJECT_ID}/repository/tags" \
              --method POST \
              -f "tag_name=v${VERSION}" \
              -f "ref=${CI_COMMIT_SHA}" \
              -f "message=xquad v${VERSION}" 2>&1); then
                if echo "$TAG_OUT" | grep -qi "already exists"; then
                    echo "Tag v${VERSION} already exists -- skipping."
                else
                    echo "Failed to create tag v${VERSION}: ${TAG_OUT}" >&2
                    exit 1
                fi
            fi

# ---------------------------------------------------------------------------
# Release jobs (tag-triggered)
# ---------------------------------------------------------------------------

# Validate-then-publish gate (QUI-473). Runs against the tagged commit
# on the real runner before anything touches a registry. Catches
# packaging regressions -- missing license file, broken maturin
# config, metadata drift in xqasm/xqcli not visible to the MR-time
# single-crate dry-run, pyproject manifest issues -- without leaving
# half-published artefacts behind on a partial failure.
#
# Crate dry-run note (QUI-498): xqvm gets a full `cargo publish
# --dry-run` because it has no internal workspace deps. xqasm/xqcli
# go through `scripts/validate-crate-publish.sh` because cargo's
# pack step still resolves their `xqvm = "X.Y.Z"` workspace dep
# against crates.io (even with `--no-verify`, which only skips the
# *build* verify, not the *resolve* step). At the first publish of
# the workspace the dep doesn't exist on crates.io yet, so the
# wrapper tolerates that specific failure mode and lets the validate
# job pass; any other dry-run error (real metadata drift, missing
# license file, etc.) still fails the job. From v0.1.1 onwards
# (xqvm on crates.io), the wrapper is just a pass-through.
release:validate:
    stage: release
    <<: *on-release-tag
    before_script:
        - *setup-python-publish
    script:
        - cargo --version
        - cargo publish --dry-run --locked -p xqvm
        - bash scripts/validate-crate-publish.sh xqasm --no-verify
        - bash scripts/validate-crate-publish.sh xqcli --no-verify
        # See scripts/python-dists.sh for the package list and the
        # build/check sequence (shared with release:dry-run:pypi).
        - bash scripts/python-dists.sh check

# Publish the three Rust crates to crates.io in topological dependency
# order: xqvm (no deps) → xqasm (depends on xqvm) → xqcli (depends on
# both). The `xqffi` crate keeps `publish = false` — it's a pyo3
# cdylib consumed via the PyPI wheel, not a crates.io dependency.
release:publish-crates:
    stage: release
    needs:
        - release:validate
    <<: *on-release-tag
    script:
        - cargo --version
        - cargo publish --locked -p xqvm --token "${CARGO_REGISTRY_TOKEN}"
        - cargo publish --locked -p xqasm --token "${CARGO_REGISTRY_TOKEN}"
        - cargo publish --locked -p xqcli --token "${CARGO_REGISTRY_TOKEN}"

# Publish the Python distributions to PyPI. Order matters: xquad is
# the umbrella meta-package and depends on the peers, so it must land
# *after* them or `pip install xquad` cannot resolve its deps.
#
#   1. xqffi            (pyo3 cdylib — maturin builds manylinux wheels)
#   2. xqvm_py          (pure-Python reference VM)
#   3. xqcp             (DSL)
#   4. xqsa             (solver adapters)
#   5. xquad            (umbrella — depends on 1-4)
#
# maturin build + twine upload (OIDC) produces wheels for the current
# runner's platform tag. The full matrix (linux-x86_64 + linux-aarch64
# + macos-arm64 + windows-x86_64) requires a multi-runner fan-out; for
# v0.1.0 we ship linux-x86_64 only and track the matrix as a
# RELEASING.md follow-up.
release:publish-pypi:
    stage: release
    needs:
        - release:validate
        - release:publish-crates
    <<: *on-release-tag
    # `environment: release` matches the env name registered on each
    # PyPI Trusted Publisher; PyPI rejects the OIDC exchange if the
    # job's environment doesn't match what's configured project-side.
    environment: release
    # GitLab mints a short-lived JWT into `PYPI_ID_TOKEN`; twine ≥6.1
    # auto-detects it (via `id.detect_credential("pypi")`) and
    # exchanges it for a per-project PyPI API token at upload time.
    # Audience MUST be the literal `pypi` (not `pypi.org`).
    id_tokens:
        PYPI_ID_TOKEN:
            aud: pypi
    before_script:
        - *setup-python-publish
    script:
        # See scripts/python-dists.sh for the package list and the
        # build/upload sequence.
        - bash scripts/python-dists.sh publish

# Generate GitLab Release notes from the conventional-commit history
# via git-cliff (cliff.toml). Runs on every release tag and uploads
# `release-notes.md` as an artefact for `release:notes` to consume.
#
# `STRIP=all` drops the cliff.toml header/footer so the published
# notes contain only the tag's own section -- the GitLab release page
# already supplies its own framing (tag name, date, etc.).
#
# CHANGELOG.md is gitignored; the in-tree source of truth for release
# notes is `cliff.toml` plus the conventional-commit log.
#
# `GIT_DEPTH: 0` overrides GitLab's default shallow clone -- git-cliff
# walks the full commit history back through tag boundaries to render
# release sections, so a shallow clone produces silently truncated
# notes. The same override is set on `lint:changelog`.
release:changelog:
    stage: release
    # Runs after publish-pypi so the GitLab Release page goes up only
    # once artefacts are live on crates.io and PyPI (QUI-496).
    needs:
        - release:publish-pypi
    <<: *on-release-tag
    variables:
        GIT_DEPTH: 0
    before_script:
        - export PATH="${CARGO_HOME}/bin:${PATH}"
        # Install only git-cliff (version pinned in
        # scripts/cargo-tools.lock); the rest of the cargo toolchain
        # isn't needed to render the changelog.
        - bash scripts/install-cargo-tools.sh --only git-cliff
    script:
        - make changelog-release VERSION="${CI_COMMIT_TAG}" STRIP=all OUTPUT=release-notes.md
        - cat release-notes.md
    artifacts:
        paths:
            - release-notes.md
        expire_in: 30 days

# Create the GitLab Release page for the tag with the git-cliff-
# generated notes as the description. Uses the declarative `release:`
# keyword so CI_JOB_TOKEN is sufficient — no extra PAT needed, and the
# job is idempotent (re-running does not error if the release exists).
release:notes:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    cache: []
    needs:
        - job: release:changelog
          artifacts: true
    <<: *on-release-tag
    script:
        - echo "Creating release for ${CI_COMMIT_TAG}"
    release:
        tag_name: $CI_COMMIT_TAG
        name: "xquad ${CI_COMMIT_TAG}"
        description: ./release-notes.md

# ---------------------------------------------------------------------------
# Dry-run jobs (MR / push — validate the release path without publishing)
# ---------------------------------------------------------------------------

# `cargo publish --dry-run` validates the packaged crate without
# uploading: Cargo.toml metadata, license files, doc build, dependency
# versions, etc. Running for every MR catches release-blocking
# regressions long before the tag is cut.
#
# Only `xqvm` is dry-run with the full verify build because xqasm +
# xqcli's workspace dependencies resolve against crates.io (where the
# just-bumped xqvm hasn't been pushed yet during a dry-run). The
# tag-time `release:validate` job covers all three crates -- xqvm
# fully, xqasm/xqcli with `--no-verify` -- before any publish runs.
release:dry-run:crates:
    stage: lint
    <<: *on-pr-or-push
    script:
        - cargo --version
        - cargo publish --locked --dry-run -p xqvm

# maturin build + twine check validate that wheels + sdists would
# upload cleanly. No token needed; no network upload.
release:dry-run:pypi:
    stage: lint
    <<: *on-pr-or-push
    before_script:
        - *setup-python-publish
    script:
        # See scripts/python-dists.sh for the package list and the
        # build/check sequence (shared with release:validate).
        - bash scripts/python-dists.sh check

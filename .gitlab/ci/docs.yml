# Documentation pipeline -- checks generated docs and book drift in lint,
# builds the mdBook site in the docs stage, then publishes it to GitLab Pages
# at https://docs.quip.network/xquad/ (QUI-988).

.install-deps: &install-deps
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - make deps-docs

.install-uv: &install-uv
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="${HOME}/.local/bin:${PATH}"
    - uv sync

lint:docs-generated:
    stage: lint
    cache: []
    before_script:
        - *install-uv
    script:
        - make docs-check

lint:docs-drift:
    stage: lint
    image: alpine:3
    cache: []
    before_script:
        - apk add --no-cache bash grep
    script:
        - bash scripts/check-docs-drift.sh

lint:docs-readme:
    stage: lint
    image: alpine:3
    cache: []
    before_script:
        - apk add --no-cache bash grep
    script:
        - bash scripts/check-readme-length.sh

docs:build:
    stage: docs
    before_script:
        - *install-deps
    script:
        - make docs
    artifacts:
        paths:
            - docs/book/build/

# Publish the book. Reuses the docs:build artifact rather than rebuilding, so
# this job needs no Rust toolchain and no cargo cache.
#
# The job must be named exactly `pages` for GitLab to treat it as a Pages
# deployment. It only runs on direct pushes to main, so merge request and tag
# pipelines build the book without publishing it.
pages:
    stage: pages
    image: alpine:3
    cache: []
    needs:
        - job: docs:build
          artifacts: true
    environment:
        name: pages
        url: https://docs.quip.network/xquad/
    script:
        - mkdir -p public/xquad
        - cp -r docs/book/build/. public/xquad/
        # On a custom domain GitLab Pages serves only /404.html, from the root
        # of public/ -- public/xquad/404.html is never reached. The copy at the
        # root resolves its assets through book.toml's site-url.
        - cp docs/book/build/404.html public/404.html
        - cp .gitlab/pages/_redirects .gitlab/pages/robots.txt public/
        - sh scripts/gen-sitemap.sh public/xquad https://docs.quip.network/xquad > public/xquad/sitemap.xml
    artifacts:
        paths:
            - public
    rules:
        # Only on direct pushes to main -- not on tag pipelines or MR
        # pipelines (MR pipelines run before the merge; we publish after).
        - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
          when: on_success

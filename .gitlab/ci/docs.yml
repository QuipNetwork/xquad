# Documentation pipeline -- checks generated-docs freshness and handwritten
# book drift, then builds the mdBook site. The built book is delivered as the
# docs:build artifact and served from https://developers.quip.network/docs/xquad/
# (QUI-1331); GitLab Pages now publishes only the redirect shim that points
# docs.quip.network at that host.
#
# All four jobs `needs:` every verify:*, test:*, and hardware:* job (see
# setup.yml's "Dependency gating" section) -- docs publish only once the
# workspace is known to compile, behave, and work on real hardware.
#
# `.rust` / `.rust-tools` / `.alpine` / `.python-tools` (templates) and
# `.fragments` / `.needs-gates` (shared script sequences and needs lists)
# live in .gitlab/ci/setup.yml, included first by the root .gitlab-ci.yml.

# `make check-docs-generated` (see the Makefile's DOCSGEN comment) runs the
# two generators through `uv run --no-project --isolated`, not a workspace
# sync -- both import only scripts/_docsgen.py, scripts/_scriptio.py and
# PyYAML. This job therefore needs uv on PATH but not a synced workspace,
# so it shares `.python-tools`'s cache instead of paying a cold resolve
# (and a maturin build of xqffi's cdylib) every pipeline just to diff
# some YAML.
docs:generated:
    stage: docs
    extends: .python-tools
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    # 10m: compiles nothing -- a cold run only fetches uv and PyYAML
    # before diffing the generated pages. See setup.yml's "Job timeouts"
    # section.
    timeout: 10m
    script:
        - make -k check-docs-generated

# Handwritten-docs checks -- book prose/SUMMARY drift, published package
# README length, and the Vale prose lint -- merged into one job running
# `make -k check-docs-handwritten` (check-docs-drift check-docs-readme
# check-docs-prose). All three are alpine-only, need no uv and no mdbook
# -- unlike docs:generated above, which needs uv to import
# scripts/_docsgen.py. `cache: []` (via `.alpine`) stays deliberate
# here, not an oversight: these jobs compile nothing, so downloading
# the (irrelevant) default cargo cache would be pure waste.
#
# `make` is in APK_PACKAGES because alpine ships neither bash nor make
# in its base image. The two original checks used to be invoked as `bash
# scripts/...` directly, so make was not needed; routing them through
# the Makefile means the job now depends on it. Dropping it fails at
# `make: not found` with exit 127 before any check runs. The other four
# entries are Vale's: `curl` and `tar` fetch and unpack it, and
# `gcompat libstdc++ libgcc` are what let it run. Vale is a Go binary
# but not a static one -- it links glibc and libstdc++ for the spell
# checker -- so alpine needs the shim and the C++ runtime. That is four
# small packages and no language runtime, which is still a long way
# short of turning this back into a toolchain image; see the `vale`
# fragment in setup.yml for how the failure presents without them.
docs:handwritten:
    stage: docs
    extends: .alpine
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    variables:
        APK_PACKAGES: "bash grep make curl tar gcompat libstdc++ libgcc"
    # 10m: an alpine container running bash scripts, so the only cold
    # costs are the apk fetch and Vale's 40 MB release tarball. Sized like
    # docs:generated rather than tighter because two samples of this job
    # already swung 8.6x (10s / 86s). See setup.yml's "Job timeouts"
    # section.
    timeout: 10m
    before_script:
        - !reference [.fragments, apk]
        - !reference [.fragments, vale]
    script:
        - make -k check-docs-handwritten

# mdbook + mdbook-mermaid only -- no cargo compile -- so this installs just
# those two tools (see the `--only` note in setup.yml) rather than the full
# dev-tool set `make deps` would pull in, and its cache narrows to
# `.rust-tools`'s `.cargo/bin/` entry instead of carrying the full `target/`
# cache in both directions for a job that never touches it. Unticketed, and
# a bigger per-pipeline saving than the hardware uv-cache fix in Phase C2.
docs:build:
    stage: docs
    extends: .rust-tools
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    variables:
        CARGO_TOOLS: mdbook,mdbook-mermaid
    # 15m: cold-cache room for the mdbook and mdbook-mermaid installs on
    # top of the book build itself. See setup.yml's "Job timeouts"
    # section.
    timeout: 15m
    script:
        - make -k build-docs
        # The sitemap is generated here rather than at publish time because the
        # artifact is now the delivered product: the portal unpacks this whole
        # tree at its own build time (QUI-1331), so anything the published book
        # needs has to be inside it.
        - sh scripts/gen-sitemap.sh docs/book/build https://developers.quip.network/docs/xquad > docs/book/build/sitemap.xml
    artifacts:
        paths:
            - docs/book/build/

# Publish the redirect shim, and tell the docs host to pick up a new book.
#
# This job used to publish the book itself. Since QUI-1331 the book is served
# from developers.quip.network/docs/xquad/, which owns the documentation
# canonical, and this host holds no content of its own. That is not a tidy-up:
# gitlab-pages resolves a request with tryFile before tryRedirects, so while a
# copy of the book still sat in public/xquad/ the /xquad/* rule in _redirects
# could never fire and docs.quip.network/xquad/<path> would keep serving a
# second copy instead of redirecting to the canonical one.
#
# It still `needs:` docs:build without taking its artifacts, so the build hook
# below cannot fire for a pipeline whose book failed to build.
#
# `pages: true` is what tells GitLab this job is a Pages deployment -- GA on
# gitlab.com since 17.9. Before that property existed, GitLab detected a
# Pages job by name alone: it had to be called exactly `pages`, which would
# have made this the one job in the pipeline unable to follow the
# `docs:*` prefix-equals-stage convention. Declaring the deployment
# explicitly frees the name, which is what let the phase regroup rename it
# to `docs:publish` along with everything else. Do not rename it back, and
# do not drop `pages: true` -- without the property the deployment stops
# happening silently, since a job named `docs:publish` is not one GitLab
# recognises by name. It only runs on a release tag, so branch and merge
# request pipelines build the book without publishing it.
#
# Inline shell instead of a `make` target: every other job in
# this repo's CI calls `make -k <target>` so the CI definition and the
# local workflow stay identical, but a Pages deploy has no local meaning
# to converge on -- there is no local GitLab Pages environment to publish
# into. Routing this through the Makefile would create a CI-only target
# that exists solely to be a thin wrapper around this script, which is the
# behaviour the "CI always calls make" rule exists to avoid, not honour.
# This job is the deliberate exception.
docs:publish:
    stage: docs
    extends: .alpine
    pages: true
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
        - job: docs:build
          artifacts: false
    environment:
        name: pages
        url: https://docs.quip.network/
    script:
        - mkdir -p public
        - cp .gitlab/pages/_redirects .gitlab/pages/robots.txt public/
        # Ask Netlify to rebuild the docs host, which pulls this pipeline's
        # docs:build artifact and unpacks it at /docs/xquad/.
        #
        # The pipeline id travels in the POST body. Netlify exposes it to the
        # portal build as INCOMING_HOOK_BODY, and the portal resolves docs:build
        # inside that pipeline and downloads the artifact by job id. It must
        # not use the by-ref endpoint (/jobs/artifacts/main/download?job=...)
        # instead: that one serves the latest *successful* pipeline, and this
        # pipeline cannot be successful while this job is still running, so
        # it would hand Netlify the previous push's book on nearly every merge.
        # docs:build itself is guaranteed complete here by the `needs:` edge.
        - test -n "${NETLIFY_BUILD_HOOK}" || { echo "NETLIFY_BUILD_HOOK is not set; the docs host will not pick up this book."; exit 1; }
        - wget -q -O /dev/null --post-data="pipeline_id=${CI_PIPELINE_ID}" "${NETLIFY_BUILD_HOOK}"
    artifacts:
        paths:
            - public
    rules:
        # Only on a release tag. This read `$CI_COMMIT_BRANCH == "main"
        # && $CI_PIPELINE_SOURCE == "push"` until QUI-1256, which held
        # while main carried the last release. Under the two-branch
        # protocol main is a working branch at `x.y.z-dev`, so a push to
        # it is in-progress documentation and publishing that puts pages
        # on the site describing a toolchain nobody can install. What
        # ships is what the tag carries.
        #
        # The pattern is cliff.toml's tag_pattern, so a prerelease tag
        # publishes nothing, for the same reason release:notes skips one:
        # an rc or a beta is not what a reader pinning the toolchain
        # installs. docs/book/src/appendix/stability.md tells a reader on
        # an older line how to build that tag's book locally, which is
        # the route this rule leaves them.
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
          when: on_success

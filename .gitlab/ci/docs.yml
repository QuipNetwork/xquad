# Documentation pipeline -- checks generated-docs freshness and handwritten
# book drift, builds the mdBook site, then publishes it to GitLab Pages at
# https://docs.quip.network/xquad/ (QUI-988).
#
# All four jobs `needs:` every verify:*, test:*, and hardware:* job (see
# setup.yml's "Dependency gating" section) -- docs publish only once the
# workspace is known to compile, behave, and work on real hardware.
#
# `.rust` / `.rust-tools` / `.alpine` / `.python-tools` (templates) and
# `.fragments` / `.needs-gates` (shared script sequences and needs lists)
# live in .gitlab/ci/setup.yml, included first by the root .gitlab-ci.yml.

# `make check-docs-generated` (see the Makefile's DOCSGEN comment) runs the
# two generators through `uv run --no-project --isolated`, not a workspace
# sync -- both import only scripts/_docsgen.py and PyYAML. This job
# therefore needs uv on PATH but not a synced workspace, so it shares
# `.python-tools`'s cache instead of paying a cold resolve (and a maturin
# build of xqffi's cdylib) every pipeline just to diff some YAML.
docs:generated:
    stage: docs
    extends: .python-tools
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    # 10m: compiles nothing -- a cold run only fetches uv and PyYAML
    # before diffing the generated pages. See setup.yml's "Job timeouts"
    # section.
    timeout: 10m
    script:
        - make -k check-docs-generated

# Handwritten-docs checks -- book prose/SUMMARY drift and published
# package README length -- merged into one job running
# `make -k check-docs-handwritten` (check-docs-drift check-docs-readme).
# Both are alpine-only, need no uv and no mdbook -- unlike
# docs:generated above, which needs uv to import
# scripts/_docsgen.py. `cache: []` (via `.alpine`) stays deliberate
# here, not an oversight: these jobs compile nothing, so downloading
# the (irrelevant) default cargo cache would be pure waste.
#
# `make` is in APK_PACKAGES because alpine ships neither bash nor make
# in its base image. The two checks used to be invoked as `bash
# scripts/...` directly, so make was not needed; routing them through
# the Makefile means the job now depends on it. Dropping it fails at
# `make: not found` with exit 127 before either check runs.
docs:handwritten:
    stage: docs
    extends: .alpine
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    variables:
        APK_PACKAGES: "bash grep make"
    # 10m: an alpine container running a bash script, so the only cold
    # cost is the apk fetch. Sized like docs:generated rather than tighter
    # because two samples of this job already swung 8.6x (10s / 86s). See
    # setup.yml's "Job timeouts" section.
    timeout: 10m
    before_script:
        - !reference [.fragments, apk]
    script:
        - make -k check-docs-handwritten

# mdbook + mdbook-mermaid only -- no cargo compile -- so this installs just
# those two tools (see the `--only` note in setup.yml) rather than the full
# dev-tool set `make deps` would pull in, and its cache narrows to
# `.rust-tools`'s `.cargo/bin/` entry instead of carrying the full `target/`
# cache in both directions for a job that never touches it. Unticketed, and
# a bigger per-pipeline saving than the hardware uv-cache fix in Phase C2.
docs:build:
    stage: docs
    extends: .rust-tools
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
    variables:
        CARGO_TOOLS: mdbook,mdbook-mermaid
    # 15m: cold-cache room for the mdbook and mdbook-mermaid installs on
    # top of the book build itself. See setup.yml's "Job timeouts"
    # section.
    timeout: 15m
    script:
        - make -k build-docs
    artifacts:
        paths:
            - docs/book/build/

# Publish the book. Reuses the docs:build artifact rather than rebuilding, so
# this job needs no Rust toolchain and no cargo cache.
#
# `pages: true` is what tells GitLab this job is a Pages deployment -- GA on
# gitlab.com since 17.9. Before that property existed, GitLab detected a
# Pages job by name alone: it had to be called exactly `pages`, which would
# have made this the one job in the pipeline unable to follow the
# `docs:*` prefix-equals-stage convention. Declaring the deployment
# explicitly frees the name, which is what let the phase regroup rename it
# to `docs:publish` along with everything else. Do not rename it back, and
# do not drop `pages: true` -- without the property the deployment stops
# happening silently, since a job named `docs:publish` is not one GitLab
# recognises by name. It only runs on direct pushes to main, so merge
# request and tag pipelines build the book without publishing it.
#
# Five inline shell lines instead of a `make` target: every other job in
# this repo's CI calls `make -k <target>` so the CI definition and the
# local workflow stay identical, but a Pages deploy has no local meaning
# to converge on -- there is no local GitLab Pages environment to publish
# into. Routing this through the Makefile would create a CI-only target
# that exists solely to be a thin wrapper around this script, which is the
# behaviour the "CI always calls make" rule exists to avoid, not honour.
# This job is the deliberate exception.
docs:publish:
    stage: docs
    extends: .alpine
    pages: true
    needs:
        - !reference [.needs-gates, verify-test-and-hardware]
        - job: docs:build
          artifacts: true
    environment:
        name: pages
        url: https://docs.quip.network/xquad/
    script:
        - mkdir -p public/xquad
        - cp -r docs/book/build/. public/xquad/
        # On a custom domain GitLab Pages serves only /404.html, from the root
        # of public/ -- public/xquad/404.html is never reached. The copy at the
        # root resolves its assets through book.toml's site-url.
        - cp docs/book/build/404.html public/404.html
        - cp .gitlab/pages/_redirects .gitlab/pages/robots.txt public/
        - sh scripts/gen-sitemap.sh public/xquad https://docs.quip.network/xquad > public/xquad/sitemap.xml
    artifacts:
        paths:
            - public
    rules:
        # Only on direct pushes to main -- not on tag pipelines or MR
        # pipelines (MR pipelines run before the merge; we publish after).
        - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
          when: on_success

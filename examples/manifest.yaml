# `hardware: true` on an example entry marks it as part of the subset
# scripts/example-smoke.py replays against real hardware backends
# (cuda-gpu, dwave-qpu, metal-gpu). Kept small -- a binary problem
# (maxcut), a permutation (tsp), and a constrained problem (knapsack)
# -- to bound GPU time and the monthly D-Wave QPU quota; every example
# still runs on the CPU annealer on both interpreters regardless of
# this flag. Omit the key (or set it to `false`) for every other entry.
preserved_pages:
  - using-examples.md

groups:
  - id: graph-problems
    title: Graph problems
    intro: Examples that encode graph cuts, colouring, covers, independent sets, and tours.
    examples:
      - dir: maxcut
        title: Max-Cut
        blurb: Find a 2-colour partition of a weighted graph that maximises the cut weight.
        hardware: true
      - dir: graph_coloring
        title: Graph Coloring
        blurb: Assign colours to graph nodes so adjacent nodes do not share a colour.
      - dir: max_independent_set
        title: Maximum Independent Set
        blurb: Select the largest subset of graph nodes with no selected edge between them.
      - dir: vertex_cover
        title: Vertex Cover
        blurb: Select the smallest vertex subset that covers every graph edge.
      - dir: tsp
        title: Travelling Salesman Problem
        blurb: Find the shortest Hamiltonian tour through a random symmetric distance matrix.
        hardware: true
  - id: selection-and-packing
    title: Selection and packing
    intro: Examples that select subsets, cover demands, pack bins, and balance integer weights.
    examples:
      - dir: knapsack
        title: Knapsack
        blurb: Select items that maximise value while respecting a capacity constraint.
        hardware: true
      - dir: bin_packing
        title: Bin Packing
        blurb: Pack items into the minimum number of fixed-capacity bins.
      - dir: set_cover
        title: Set Cover
        blurb: Select the minimum set collection whose union covers the universe.
      - dir: weighted_set_cover
        title: Weighted Set Cover
        blurb: Select sets with capacities to cover element demands at minimum cost.
      - dir: number_partition
        title: Number Partition
        blurb: Split positive integers into two subsets with nearly equal sums.
      - dir: portfolio_opt
        title: Portfolio Optimization
        blurb: Select a fixed-size portfolio while penalising higher-order risk interactions.
  - id: satisfiability-and-higher-order
    title: Satisfiability and higher-order
    intro: Examples that reduce clauses and higher-order pseudo-Boolean objectives to quadratic models.
    examples:
      - dir: max3sat
        title: Max-3-SAT
        blurb: Find the assignment that satisfies the maximum number of 3-literal clauses.
      - dir: cubic_opt
        title: Cubic Optimization
        blurb: Minimise a cubic pseudo-Boolean objective through HOBO degree reduction.
      - dir: quartic_opt
        title: Quartic Optimization
        blurb: Minimise a degree-4 pseudo-Boolean objective through two-stage REDUCE chaining.

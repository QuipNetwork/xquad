# xquad repo root pyproject.
#
# Declares the uv workspace spanning every Python package in the repo
# (xqffi, xqcp, xqsa, xquad) plus the dev tools used to lint
# and test them. No buildable project of its own — `uv sync` installs
# workspace members in editable mode into a shared `.venv/`.
#
# Per-package pyproject.toml files under each member directory carry the
# actual project metadata, dependency lists, and build backend.

[tool.uv.workspace]
members = [ "xqffi", "xqcp", "xqsa", "xquad" ]

# Build xqffi with `cargo --locked` when uv builds it for the workspace, the
# contract every resolving cargo call carries (CONTRIBUTING.md,
# "Dependencies and Lockfiles"). Set here, not as `locked = true` under
# xqffi's `[tool.maturin]`: that table ships in the sdist, whose pruned
# workspace no longer matches its Cargo.lock, so `--locked` would refuse
# every build from the sdist.
#
# `--profile dev` keeps the build `maturin develop` used to give: overflow
# checks and `debug_assert!`s stay on for test-py, parity and example
# smoke, and a Rust edit costs an unoptimized rebuild. Without it the
# PEP 517 build defaults to release.
#
# `exclude-newer-package` exempts certifi from any `exclude-newer` cooldown a
# machine sets in its own uv config, as the macOS Metal runner does. The quip
# extra's certifi floor (xqsa/pyproject.toml) is a security fix that can be
# younger than such a cooldown, and uv resolves every extra of the workspace,
# so without this exemption a cooldown fails `uv sync` for any extra.
[tool.uv]
config-settings-package = { xqffi = { build-args = "--locked --profile dev" } }
exclude-newer-package   = { certifi = false }

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.7",
    # The SolverQuip unit tests decode SCALE without the [quip] extra.
    "scalecodec>=1.2,<2",
]

# ---------------------------------------------------------------------------
# Ruff — applies to every Python package in the workspace.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"xqsa/tests/**/test_*.py" = [ "E402" ] # imports after pytest.importorskip

[tool.ruff.lint.isort]
known-first-party = [
    "xqcp",
    "xqsa",
    "xqffi",
    "xquad",
    "_docsgen",
    "_hwprobe",
    "_scriptio",
]

# ---------------------------------------------------------------------------
# Pytest — consolidated discovery root so `pytest` from repo root picks up
# every package's tests/. Each package also carries its own conftest if
# needed.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = [ "xqcp/tests", "xqsa/tests", "xquad/tests", "scripts/tests" ]
markers = [
    "qpu: live D-Wave QPU tests (require DWAVE_API_TOKEN)",
    "cuda: real NVIDIA CUDA GPU tests (require cupy + a CUDA device)",
    "metal: real Apple Metal GPU tests (require macOS + a Metal device)",
    "quip: live Quip Network devnet tests (require QUIP_RPC_URL)",
    "quip_cpu: real quip-cpu-sa binary tests (require XQSA_QUIP_CPU_SA=<path to the binary>)",
]

# Suppress duplicate pipelines: when a branch has an open MR, only the MR
# pipeline runs (so the MR badge reflects the full quality gate). Branch
# pipelines still fire for pre-MR development; tag pipelines fire for
# releases.
workflow:
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
          when: never
        - if: $CI_COMMIT_BRANCH

# Root pipeline — composition only.
#
# Jobs are authored in per-stage files under .gitlab/ci/ and pulled in
# via `include:` so each pipeline phase (verify, test, hardware, docs,
# release) can be reasoned about on its own and edited without touching
# the root. `.gitlab/ci/setup.yml` is included first — it holds
# the shared script fragments and job templates every other file's jobs
# extend or reference (see that file's header for the anchors-vs-extends
# rationale).
#
# Caching strategy (see QUI-460 for context):
#
#   Two default cache entries per job. The first is Cargo.lock-keyed
#   and holds the build artefacts that change with the lock (registry
#   / git / target). The second is cargo-tools-lock-keyed and holds
#   `.cargo/bin/` — prebuilt dev-tool binaries that only rebuild when
#   scripts/cargo-tools.lock changes.
#
#   Both keys are hash-only (no `prefix:`), which makes them project-
#   wide rather than branch-scoped: any branch whose Cargo.lock /
#   cargo-tools.lock hash matches main's hits main's cache directly
#   — no fallback needed for the common case. A branch that bumps
#   either lock file cold-starts on its first pipeline; this is a
#   deliberate tradeoff against the complexity of a cache-warmer job
#   on main, since lock-file bumps are rare.
#
#   GitLab's `fallback_keys:` is exact-match, not prefix-match, so a
#   static fallback string like `main-cargo` would never match main's
#   hash-based key and is omitted rather than misleading.
#
#   CACHE WRITERS: verify:rust, test:rust and test:wasm (the `.rust`
#   template, .gitlab/ci/setup.yml) are the only jobs that inherit this
#   default cache unmodified and are the pushers for both entries -- all
#   three run unconditionally on every pipeline and `make deps` always
#   installs the full scripts/cargo-tools.lock set. `.rust-tools` (also in
#   setup.yml) intentionally reuses this same `.cargo/bin/` key but only
#   ever installs a named subset already covered by the three jobs above,
#   so its consumers (verify:policy, docs:build) are `policy: pull` --
#   see that template's comment before adding a fourth pull-only consumer
#   of either entry.

default:
    image: rust:latest
    # Cancel in-flight pipelines on push; saves runner minutes when
    # developers push rapidly on a WIP branch.
    interruptible: true
    # Retry on infrastructure failures only -- a runner dying mid-job, a
    # job stuck past its timeout, GitLab's own API misbehaving, or the
    # scheduler failing to place the job. All four are the CI system
    # failing the job, not the job failing on its own.
    #
    # `script_failure` is DELIBERATELY EXCLUDED. This is not theoretical:
    # a pipeline on this branch failed when GitHub returned HTTP 503 while
    # scripts/install-cargo-tools.sh was bootstrapping cargo-binstall via
    # curl -- GitLab classes that as `script_failure` because the shell
    # command (curl) exited non-zero, even though the actual cause was a
    # transient upstream outage. The finney runner failures tracked on
    # QUI-1003 fall in the same class. A blanket retry on `script_failure`
    # would silently retry-and-mask real breakage (a failing test, a
    # broken build) alongside these transient ones, so it stays out on
    # purpose -- do not add it to make the curl-flake case above go away;
    # fix that at the script level (e.g. retry the curl itself) instead.
    retry:
        max: 2
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
            - api_failure
            - scheduler_failure
    cache:
        - key:
              files:
                  - Cargo.lock
          paths:
              - .cargo/registry/
              - .cargo/git/
              - target/
        - key:
              files:
                  - scripts/cargo-tools.lock
          paths:
              - .cargo/bin/

variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
    # Skip incremental build artefacts; they bloat the cache without
    # a hit-rate win on CI's one-shot workloads.
    CARGO_INCREMENTAL: "0"
    # Faster compilations — CI doesn't debug into these binaries.
    CARGO_PROFILE_DEV_DEBUG: "0"
    # Coloured terminal output makes GitLab's log viewer pleasant.
    CARGO_TERM_COLOR: "always"
    # Fail early on sparse-registry hiccups rather than retrying 30s
    # with no feedback.
    CARGO_NET_RETRY: "2"
    # Use the sparse registry protocol (default on 1.68+, belt-and-
    # braces for older runner images).
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
    # uv installs a wheel by cloning its files out of the uv cache.
    # Those clone syscalls intermittently fail with `Resource
    # temporarily unavailable` (os error 11) on the group runners,
    # which aborts the whole `uv sync` / `uv tool install`. `copy`
    # takes uv's plain-copy path instead: marginally slower, and it
    # does not use the syscall that fails. Set pipeline-wide because
    # every uv job is exposed, not just the release dry-runs.
    UV_LINK_MODE: "copy"

stages:
    - verify
    - test
    - hardware
    - docs
    - release

include:
    - local: .gitlab/ci/setup.yml
    - local: .gitlab/ci/verify.yml
    - local: .gitlab/ci/test.yml
    - local: .gitlab/ci/hardware.yml
    - local: .gitlab/ci/docs.yml
    - local: .gitlab/ci/release.yml

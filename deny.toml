[advisories]
db-path      = "~/.cargo/advisory-db"
db-urls      = [ "https://github.com/rustsec/advisory-db" ]
unmaintained = "workspace"
# Deliberately deny: a yank often signals a pulled-for-good-reason version,
# and Cargo.lock pins exact versions, so this can turn pipelines red with no
# code change involved. When it fires, bump the pinned version to a
# non-yanked release. If the pin is not ours to bump (a transitive dependency
# yanked with no replacement published), suppress it for that one crate with
# ignore = [ { crate = "name@=x.y.z", reason = "..." } ] in this section; do
# not flip this back to "warn".
yanked = "deny"

[licenses]
confidence-threshold = 0.8

allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    # Strictly more permissive than plain Apache-2.0; pulled in by pyo3's
    # build-dep target-lexicon (LLVM-adjacent tooling).
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    # foldhash (default hasher for hashbrown 0.15) uses Zlib.
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    # Crates weaponized in the 2026-08-20 crates.io supply-chain attack
    # (https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/).
    # The malicious versions were deleted from the registry, but ban them
    # anyway in case of mirrors or vendored copies.
    { crate = "arrayref@=0.3.10" },
    { crate = "internment@=0.8.7" },
    { crate = "append-only-vec@=0.1.9" },
    # Attacker-owned dropper/typosquat crates from the same incident; no
    # version was ever legitimate. proc-macro1 in particular is one typo
    # away from proc-macro2.
    { crate = "proc-macro1" },
    { crate = "proc-macro-en" },
    { crate = "aovine" },
    { crate = "arone" },
    { crate = "aronenao" },
    { crate = "tinymember" },
]
wildcards = "allow"
highlight = "all"
skip = [
    # assert_cmd / predicates (dev-only) pull older transitive versions.
    { name = "unicode-width", version = "=0.1.14" },
    { name = "windows-sys", version = "=0.60.2" },
    # serde_yaml_ng's indexmap pulls hashbrown 0.17 while xqvm directly
    # depends on hashbrown 0.15 for no_std dataflow maps.
    { name = "hashbrown", version = "=0.17.0" },
    # tempfile's getrandom dependency currently pulls both wasip2 and wasip3,
    # which depend on different wit-bindgen versions.
    { name = "wit-bindgen", version = "=0.51.0" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]

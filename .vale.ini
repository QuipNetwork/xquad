# Prose linting for the handwritten book pages.
#
# Every setting the linter needs lives in this file and .vale/styles/, so
# `vale --no-global` gives the same verdict on any machine and in CI. The
# `--no-global` flag is not optional: without it Vale merges the developer's
# own ~/.config/vale configuration into this one, which is how a page can
# pass locally and fail in CI, or the reverse.
#
# Run it through `make check-docs-prose`, which selects the handwritten pages;
# see scripts/lint-prose.sh for why file selection is not expressed here.

StylesPath = .vale/styles

# Only errors fail the build. The house rules below are all `error`
# deliberately: a rule nobody has to fix is a rule nobody reads.
MinAlertLevel = error

[*.md]
BasedOnStyles = XQuad

[workspace]
resolver = "3"
members = [
    "xqvm",
    "xqasm",
    "xqcli",
    "conformance",
    "xqffi",
    "fixtures/xqvm-wasm",
]
# fixtures/pallet-xqvm is a standalone workspace (heavy polkadot-sdk git dep);
# excluded so it does not inflate main workspace build times.
exclude = [ "fixtures/pallet-xqvm" ]

[workspace.package]
repository = "https://gitlab.com/quip.network/xquad"
license    = "AGPL-3.0-or-later"

[workspace.dependencies]
### Workspace crates ###
# Version strings are required for `cargo publish`; `path` keeps the
# workspace build pointed at the live sources, and cargo rewrites
# dependency specs to drop the path on publish.
xqvm  = { path = "./xqvm", version = "0.4.3-dev" }
xqasm = { path = "./xqasm", version = "0.4.3-dev" }

### Common dependencies ###
clap      = { version = "4", features = [ "derive" ] }
miette    = { version = "7", features = [ "fancy", "derive" ] }
pastey    = "0.2.1"
thiserror = { version = "2", default-features = false }

serde_json = "1"

### Testing ###
assert_cmd = "2.2"
predicates = "3"

[workspace.lints.rust]
missing_docs          = "warn"
nonstandard_style     = { level = "deny", priority = -1 }
redundant_lifetimes   = "warn"
rust_2018_idioms      = { level = "deny", priority = -1 }
unreachable_pub       = "warn"
unsafe_code           = "deny"
unused_extern_crates  = "warn"
unused_imports        = "warn"
unused_must_use       = "deny"
unused_results        = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Panic prevention
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "warn"
panic_in_result_fn = "deny"
unimplemented      = "deny"
todo               = "deny"
indexing_slicing   = "warn"

# No cheating
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# Code hygiene
dbg_macro             = "warn"
print_stdout          = "deny"
print_stderr          = "deny"
redundant_clone       = "warn"
uninlined_format_args = "warn"
manual_string_new     = "warn"
use_self              = "deny"

# Safety
await_holding_lock = "deny"
large_futures      = "deny"
exit               = "deny"
mem_forget         = "deny"

# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names           = "allow"
must_use_candidate      = "allow"

[workspace.lints.rustdoc]
all = "warn"

[profile.release]
lto           = "thin"
codegen-units = 16

[profile.ci-test]
inherits         = "release"
opt-level        = 0
debug-assertions = true
overflow-checks  = true
lto              = false
codegen-units    = 256

# Pinned cargo-installed tool versions.
#
# One entry per line, formatted as:
#
#   <crate>=<version> [binary]
#
# `crate` is the crates.io name (the argument to `cargo install`);
# `version` is an exact version, no semver ranges; optional `binary`
# overrides the produced executable name when it differs from the
# crate name (e.g. `taplo-cli` ships the `taplo` binary).
#
# Consumed by `scripts/install-cargo-tools.sh` (invoked from the
# `Makefile` `deps` target) and by the `.cargo/bin/` cache key in
# `.gitlab-ci.yml`. Bump a version and
# CI rebuilds its cache on the next pipeline; leave alone and CI
# reuses the cached binary.
#
# Upgrade with care: a bump here forces every Rust CI job to
# re-install from source on the first run after the bump. Coordinate
# with infra and pick a quiet window.

taplo-cli=0.10.0 taplo
cargo-deny=0.19.4
cargo-nextest=0.9.130
mdbook=0.5.2
# mdbook-mermaid 0.17.0 is the latest release on crates.io and targets
# mdBook 0.5.0, two patches behind the 0.5.2 pinned above. No version pair
# silences the resulting "built against a different version" warning
# without downgrading mdBook, so the skew is accepted: the warning itself
# is cosmetic, and scripts/check-mermaid-render.sh is what actually guards
# that diagrams render. The skew is not entirely free, though -- see the
# header of docs/book/theme/mermaid-init.js for the one place it bites.
mdbook-mermaid=0.17.0
git-cliff=2.13.1
wasm-pack=0.15.0
cargo-zigbuild=0.22.3

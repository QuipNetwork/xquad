# nextest configuration for the XQuad workspace.
#
# The workspace under test is a VM whose whole subject is bounded
# execution, so a regression in a budget is a test that does not
# terminate rather than one that fails. Without a per-test timeout such a
# test runs to the GitLab job timeout and reports as an infrastructure
# stall, which is the least legible failure the pipeline can produce.
#
# The slowest test in the workspace finishes well inside a second, so
# `period` is set for the noisiest shared runner rather than for the
# work: a test still running after 30s is reported as slow, and one
# still running after four of those periods is killed and reported as a
# timeout failure.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

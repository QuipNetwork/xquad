# Standalone workspace -- intentionally NOT part of the root xquad workspace.
# Isolates the QuipNetwork/polkadot-sdk git dep from published crates
# and unrelated CI build times.
[workspace]
resolver = "2"

[package]
name        = "pallet-xqvm"
version     = "0.1.0"
edition     = "2021"
publish     = false
description = "FRAME pallet fixture: embeds xqvm inside a Substrate runtime for integration testing."
license     = "AGPL-3.0-or-later"

[package.metadata.docs.rs]
targets = [ "x86_64-unknown-linux-gnu" ]

[dependencies]
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = [
    "derive",
    "max-encoded-len",
] }
scale-info = { version = "2", default-features = false, features = [ "derive" ] }
xqvm = { path = "../../xqvm", default-features = false }

frame-support = { git = "https://github.com/QuipNetwork/polkadot-sdk", rev = "89495ec6dcd284257bf3789a3e7a5d7a2006686e", default-features = false }
frame-system  = { git = "https://github.com/QuipNetwork/polkadot-sdk", rev = "89495ec6dcd284257bf3789a3e7a5d7a2006686e", default-features = false }
sp-runtime    = { git = "https://github.com/QuipNetwork/polkadot-sdk", rev = "89495ec6dcd284257bf3789a3e7a5d7a2006686e", default-features = false }

[dev-dependencies]
sp-core = { git = "https://github.com/QuipNetwork/polkadot-sdk", rev = "89495ec6dcd284257bf3789a3e7a5d7a2006686e", default-features = false, features = [
    "std",
] }
sp-io = { git = "https://github.com/QuipNetwork/polkadot-sdk", rev = "89495ec6dcd284257bf3789a3e7a5d7a2006686e", features = [
    "std",
] }

[features]
default = [ "std" ]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-runtime/std",
    "xqvm/std",
]

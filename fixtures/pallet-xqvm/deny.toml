# cargo-deny policy for the standalone pallet fixture workspace.
#
# The root deny.toml covers only the root workspace, and this fixture is
# excluded from it. Its graph is ~386 packages, 36 of them git-sourced from
# QuipNetwork/polkadot-sdk, and CI builds it (test:substrate), so those
# build scripts run under this policy or under none.
#
# A separate file rather than an `allow-git` entry in the root deny.toml:
# the root workspace has no git dependency, and allowing one there would
# loosen the policy for published crates to accommodate a graph that ships
# in none of them. The same holds for the extra licenses below. The cost is
# a second [bans] list; `make lint-deny-fixture` fails when it drifts from
# the root one.

[advisories]
db-path      = "~/.cargo/advisory-db"
db-urls      = [ "https://github.com/rustsec/advisory-db" ]
unmaintained = "workspace"
# Same rule as the root deny.toml: bump a yanked pin, never flip to "warn".
yanked = "deny"
ignore = [
    # tracing-subscriber 0.3.19 (ANSI escapes in logged input; fixed in
    # 0.3.20). polkadot-sdk at the pinned rev requires `=0.3.19` exactly, so
    # the fix is unreachable until the fixture moves to a rev that lifts the
    # pin. The fixture's tests log no untrusted input to a terminal.
    { id = "RUSTSEC-2025-0055", reason = "pinned =0.3.19 by polkadot-sdk rev 89495ec; see comment" },
]

[licenses]
confidence-threshold = 0.8

# The root allow list, plus three permissive licenses the FRAME graph
# brings in, all compatible with AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    # Inflector, arrayref.
    "BSD-2-Clause",
    # curve25519-dalek, ed25519-dalek, schnorrkel, subtle (via sp-core).
    "BSD-3-Clause",
    # bip39, bitcoin_hashes, secp256k1, tiny-keccak (via sp-core).
    "CC0-1.0",
]

[bans]
# "allow" where the root says "warn": the duplicates here all come from the
# polkadot-sdk graph, which is not ours to deduplicate, and each warning
# prints a full inverse tree into the job log. Nothing that can fail the
# check is loosened, since "warn" never fails it either.
multiple-versions = "allow"
# Must match [bans].deny in the root deny.toml exactly;
# `make lint-deny-fixture` checks it. Edit both together.
deny = [
    { crate = "arrayref@=0.3.10" },
    { crate = "internment@=0.8.7" },
    { crate = "append-only-vec@=0.1.9" },
    { crate = "proc-macro1" },
    { crate = "proc-macro-en" },
    { crate = "aovine" },
    { crate = "arone" },
    { crate = "aronenao" },
    { crate = "tinymember" },
]
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]
# The one git source the fixture pins. Every git dependency in
# Cargo.toml names this URL at a fixed `rev`.
allow-git = [ "https://github.com/QuipNetwork/polkadot-sdk" ]

[build-system]
requires      = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "xquad"
description = "Umbrella meta-package for the XQuad toolchain — re-exports xqffi, xqcp, xqsa under a unified namespace."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
version = "0.3.1"
dependencies = [
    "xqffi",
    "xqcp",
    "xqsa",
    "xqvm_py",
]

[project.optional-dependencies]
cuda  = [ "xqsa[cuda]" ]
dwave = [ "xqsa[dwave]" ]
metal = [ "xqsa[metal]" ]
quip  = [ "xqsa[quip]" ]

[tool.uv.sources]
xqffi.workspace   = true
xqcp.workspace    = true
xqsa.workspace    = true
xqvm_py.workspace = true

[tool.hatch.build.targets.wheel]
only-include = [ "." ]
sources = { "." = "xquad" }
dev-mode-dirs = [ ".." ]
exclude = [
    "tests/**",
    "pyproject.toml",
    "README.md",
    "PKG-INFO",
    ".gitignore",
    # Agent instructions, never package content. CLAUDE.md is gitignored today
    # so it cannot reach the wheel, but the exclude survives a .gitignore edit.
    "AGENTS.md",
    "CLAUDE.md",
]

[tool.hatch.metadata]
# The package directory is the project root. `sources` rewrites the wheel
# prefix to the package name; `dev-mode-dirs` puts the repo root on
# sys.path for editable installs.
allow-direct-references = true

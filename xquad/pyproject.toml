[build-system]
requires      = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "xquad"
description = "Umbrella meta-package for the XQuad toolchain — re-exports xqffi, xqcp, xqsa under a unified namespace."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
version = "0.4.1b1"
dependencies = [
    # Pinned exact, and bumped with the workspace version on every release.
    # The umbrella re-exports the peers by identity (`xquad.cp.Problem is
    # xqcp.Problem`), so a mixed-version install would re-export an API this
    # package was never built against. Exact pins also make a partial
    # `release:pypi` upload fail resolution loudly instead of silently
    # resolving a sibling back to the previous release.
    "xqffi==0.4.1b1",
    "xqcp==0.4.1b1",
    "xqsa==0.4.1b1",
    "xqvm_py==0.4.1b1",
]

[project.optional-dependencies]
cuda  = [ "xqsa[cuda]==0.4.1b1" ]
dwave = [ "xqsa[dwave]==0.4.1b1" ]
metal = [ "xqsa[metal]==0.4.1b1" ]
quip  = [ "xqsa[quip]==0.4.1b1" ]

[tool.uv.sources]
xqffi.workspace   = true
xqcp.workspace    = true
xqsa.workspace    = true
xqvm_py.workspace = true

[tool.hatch.build.targets.wheel]
only-include = [ "." ]
sources = { "." = "xquad" }
dev-mode-dirs = [ ".." ]
exclude = [
    "tests/**",
    "pyproject.toml",
    "README.md",
    "PKG-INFO",
    ".gitignore",
    # Agent instructions, never package content. CLAUDE.md is gitignored today
    # so it cannot reach the wheel, but the exclude survives a .gitignore edit.
    "AGENTS.md",
    "CLAUDE.md",
]

[tool.hatch.metadata]
# The package directory is the project root. `sources` rewrites the wheel
# prefix to the package name; `dev-mode-dirs` puts the repo root on
# sys.path for editable installs.
allow-direct-references = true

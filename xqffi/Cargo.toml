[package]
name                 = "xqffi"
description          = "PyO3 FFI bindings exposing xqvm + xqasm to Python; produces the `xqffi` Python extension"
version              = "0.4.1-beta1"
edition              = "2024"
rust-version         = "1.85"
license.workspace    = true
repository.workspace = true
publish              = false

[lints]
workspace = true

[lib]
name       = "xqffi"
crate-type = [ "cdylib", "rlib" ]

[dependencies]
xqvm.workspace  = true
xqasm.workspace = true
pyo3            = { version = "0.29", features = [ "extension-module", "abi3-py313" ] }

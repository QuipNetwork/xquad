[build-system]
requires      = [ "maturin>=1.7,<2" ]
build-backend = "maturin"

[project]
name            = "xqffi"
description     = "PyO3 FFI bindings exposing the XQuad Rust runtime (xqvm + xqasm) to Python"
readme          = "README.md"
requires-python = ">=3.13"
license         = { text = "AGPL-3.0-or-later" }
dynamic         = [ "version" ]

[tool.maturin]
manifest-path = "Cargo.toml"
# Mixed layout: the extension builds as `xqffi/xqffi.*.so` beside a package
# shim and the submodule type stubs under `python/xqffi/`. A pure-Rust layout
# ships only one `.pyi`, which cannot describe `xqffi.vm` and its siblings.
module-name   = "xqffi.xqffi"
python-source = "python"
# A local test run leaves bytecode caches beside the shim; maturin before 1.14
# would ship them.
exclude = [ "**/__pycache__/**" ]
strip   = true

# uv rebuilds a local package only when one of its cache keys changes, and
# the default keys are just the packaging files. List every input to the
# cdylib so a plain `uv sync` / `uv run` rebuilds after a Rust edit in xqffi
# or the crates it links (`cargo tree -p xqffi`), plus the readme metadata
# and the root pyproject.toml that carries the build's cargo arguments. uv
# compares modification times, not content: a tool that restores an old
# mtime over new content (`cp -p`, `rsync -t`) defeats it.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../pyproject.toml" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "../rust-toolchain.toml" },
    { file = "../.cargo/config.toml" },
    { file = "../xqvm/Cargo.toml" },
    { file = "../xqvm/build.rs" },
    { file = "../xqvm/src/**/*.rs" },
    { file = "../xqasm/Cargo.toml" },
    { file = "../xqasm/src/**/*" },
    { file = "../xqvm/opcodes.yaml" },
]
